[platformio]
default_envs = ttgo_tdisplay

[env:ttgo_tdisplay]
platform = espressif32@6.3.2
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

[env:ttgo_tdisplay_rd_trace]
extends = env:ttgo_tdisplay
build_flags = -DDMD_RD_TRACE

[env:ttgo_tdisplay_attract_sequence]
extends = env:ttgo_tdisplay_rd_trace
build_flags = ${env:ttgo_tdisplay_rd_trace.build_flags} -DDMD_ATTRACT_SEQUENCE

[env:ttgo_tdisplay_rd_filter_compare]
extends = env:ttgo_tdisplay_attract_sequence
build_flags = ${env:ttgo_tdisplay_attract_sequence.build_flags} -DDMD_RD_FILTER_COMPARE

[env:ttgo_tdisplay_filtered_validate]
extends = env:ttgo_tdisplay_rd_filter_compare
build_flags = ${env:ttgo_tdisplay_rd_filter_compare.build_flags} -DDMD_FILTER_VALIDATE

[env:ttgo_tdisplay_filtered_recovery]
extends = env:ttgo_tdisplay_filtered_validate
build_flags = ${env:ttgo_tdisplay_filtered_validate.build_flags} -DDMD_AUTO_RECOVERY

[env:ttgo_tdisplay_filtered_recovery_slot20]
extends = env:ttgo_tdisplay_filtered_recovery
build_flags = ${env:ttgo_tdisplay_filtered_recovery.build_flags} -DDMD_INJECT_SLOT=20

[env:ttgo_tdisplay_dmd_replica]
extends = env:ttgo_tdisplay_filtered_recovery
lib_deps = bodmer/TFT_eSPI@2.5.43
lib_ldf_mode = deep+
build_flags =
    ${env:ttgo_tdisplay_filtered_recovery.build_flags}
    -DDMD_REPLICA
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_MISO=-1
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:ttgo_tdisplay_dmd_replica_fault_test]
extends = env:ttgo_tdisplay_dmd_replica
build_flags = ${env:ttgo_tdisplay_dmd_replica.build_flags} -DDMD_REPLICA_FAULT_TEST

[env:ttgo_tdisplay_dmd_replica_continuous]
extends = env:ttgo_tdisplay_dmd_replica
build_flags = ${env:ttgo_tdisplay_dmd_replica.build_flags} -DDMD_CONTINUOUS

[env:ttgo_tdisplay_dmd_replica_freezy]
extends = env:ttgo_tdisplay_dmd_replica
monitor_speed = 460800
build_flags = ${env:ttgo_tdisplay_dmd_replica.build_flags} -DDMD_FREEZY_EXPORT

[env:ttgo_tdisplay_dmd_replica_ws]
extends = env:ttgo_tdisplay_dmd_replica_continuous
build_flags = ${env:ttgo_tdisplay_dmd_replica_continuous.build_flags} -DDMD_WS_EXPORT
